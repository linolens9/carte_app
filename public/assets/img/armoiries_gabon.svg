<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Filtres & Ombres portées douces -->
    <filter id="armShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="seaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- Clip de l'écu -->
    <clipPath id="shieldClip">
      <path d="M 68 62 L 132 62 Q 132 108 100 128 Q 68 108 68 62 Z"/>
    </clipPath>
  </defs>

  <!-- CIMIER : Okoumé d'Or -->
  <g id="arbreOkoume">
    <!-- Tronc et branches -->
    <path d="M 97 64 L 97 44 Q 93 40 88 36 Q 94 36 98 40 L 98 34 Q 95 28 92 24 Q 97 26 100 32 Q 103 26 108 24 Q 105 28 102 34 L 102 40 Q 106 36 112 36 Q 107 40 103 44 L 103 64 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Couronne de feuillage d'okoumé -->
    <ellipse cx="100" cy="22" rx="28" ry="10" fill="#15803d" opacity="0.95"/>
    <ellipse cx="82" cy="26" rx="16" ry="8" fill="#16a34a"/>
    <ellipse cx="118" cy="26" rx="16" ry="8" fill="#16a34a"/>
    <ellipse cx="100" cy="18" rx="20" ry="7" fill="#22c55e"/>
    <!-- Fruits / Bourgeons or -->
    <circle cx="88" cy="20" r="1.5" fill="#fef08a"/>
    <circle cx="100" cy="15" r="1.5" fill="#fef08a"/>
    <circle cx="112" cy="20" r="1.5" fill="#fef08a"/>
  </g>

  <!-- BANDEAU SOUS L'OKOUMÉ (SUB UNITE FLORENTES) -->
  <g id="rubanSuperieur" filter="url(#armShadow)">
    <path d="M 66 45 Q 100 39 134 45 L 130 50 Q 100 44 70 50 Z" fill="url(#ribbonGrad)" stroke="#94a3b8" stroke-width="0.5"/>
    <path d="M 66 45 L 61 42 L 64 49 L 70 50 Z" fill="#e2e8f0"/>
    <path d="M 134 45 L 139 42 L 136 49 L 130 50 Z" fill="#e2e8f0"/>
    <text x="100" y="47.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="3.2" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.4">SUB UNITE FLORENTES</text>
  </g>

  <!-- SUPPORTS : Panthères noires (gauche et droite) -->
  <!-- Panthère Gauche -->
  <g id="panthereGauche" filter="url(#armShadow)">
    <!-- Corps & Pattes -->
    <path d="M 52 68 Q 56 60 62 58 Q 66 61 68 66 Q 66 76 66 94 Q 63 98 56 98 Q 52 90 48 82 Q 46 76 52 68 Z" fill="#1e293b"/>
    <!-- Patte avant haute agrippant l'écu -->
    <path d="M 62 58 Q 67 56 71 63 Q 69 66 65 64 Z" fill="#1e293b"/>
    <!-- Griffes or -->
    <circle cx="70.5" cy="62" r="1" fill="#f59e0b"/>
    <!-- Tête & Oreilles -->
    <circle cx="53" cy="56" r="6" fill="#1e293b"/>
    <path d="M 49 52 L 51 47 L 54 51 Z" fill="#0f172a"/>
    <path d="M 54 52 L 56 48 L 57 52 Z" fill="#0f172a"/>
    <!-- Yeux et gueule (langue rouge) -->
    <circle cx="51.5" cy="55" r="0.8" fill="#fbbf24"/>
    <path d="M 55 57 Q 59 58 57 60 Z" fill="#ef4444"/>
    <!-- Patte arrière et queue ondulée -->
    <path d="M 48 85 Q 38 88 36 98 Q 34 106 38 108 Q 40 106 38 100 Q 42 92 50 90 Z" fill="#1e293b"/>
    <path d="M 54 98 Q 52 108 50 116 L 56 116 Q 58 108 58 98 Z" fill="#1e293b"/>
  </g>

  <!-- Panthère Droite -->
  <g id="panthereDroite" filter="url(#armShadow)">
    <!-- Corps & Pattes -->
    <path d="M 148 68 Q 144 60 138 58 Q 134 61 132 66 Q 134 76 134 94 Q 137 98 144 98 Q 148 90 152 82 Q 154 76 148 68 Z" fill="#1e293b"/>
    <!-- Patte avant haute agrippant l'écu -->
    <path d="M 138 58 Q 133 56 129 63 Q 131 66 135 64 Z" fill="#1e293b"/>
    <!-- Griffes or -->
    <circle cx="129.5" cy="62" r="1" fill="#f59e0b"/>
    <!-- Tête & Oreilles -->
    <circle cx="147" cy="56" r="6" fill="#1e293b"/>
    <path d="M 151 52 L 149 47 L 146 51 Z" fill="#0f172a"/>
    <path d="M 146 52 L 144 48 L 143 52 Z" fill="#0f172a"/>
    <!-- Yeux et gueule (langue rouge) -->
    <circle cx="148.5" cy="55" r="0.8" fill="#fbbf24"/>
    <path d="M 145 57 Q 141 58 143 60 Z" fill="#ef4444"/>
    <!-- Patte arrière et queue ondulée -->
    <path d="M 152 85 Q 162 88 164 98 Q 166 106 162 108 Q 160 106 162 100 Q 158 92 150 90 Z" fill="#1e293b"/>
    <path d="M 146 98 Q 148 108 150 116 L 144 116 Q 142 108 142 98 Z" fill="#1e293b"/>
  </g>

  <!-- ÉCU CENTRAL (LE BLASON DU GABON) -->
  <g id="ecuCentral" filter="url(#armShadow)">
    <!-- Fond du bouclier (Or) -->
    <path d="M 68 62 L 132 62 Q 132 108 100 128 Q 68 108 68 62 Z" fill="url(#shieldGold)" stroke="#d97706" stroke-width="1.8"/>

    <!-- Éléments clippés à l'intérieur de l'écu -->
    <g clip-path="url(#shieldClip)">
      <!-- Chef de Sinople (Vert #009e49) -->
      <rect x="65" y="62" width="70" height="20" fill="#009e49"/>
      <line x1="65" y1="82" x2="135" y2="82" stroke="#d97706" stroke-width="0.8"/>

      <!-- Trois besants d'or sur le chef vert -->
      <!-- Besant 1 -->
      <circle cx="80" cy="72" r="5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.6"/>
      <circle cx="80" cy="72" r="3.2" fill="none" stroke="#fef08a" stroke-width="0.5"/>
      <!-- Besant 2 (Centre) -->
      <circle cx="100" cy="72" r="5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.6"/>
      <circle cx="100" cy="72" r="3.2" fill="none" stroke="#fef08a" stroke-width="0.5"/>
      <!-- Besant 3 -->
      <circle cx="120" cy="72" r="5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.6"/>
      <circle cx="120" cy="72" r="3.2" fill="none" stroke="#fef08a" stroke-width="0.5"/>

      <!-- Mer d'Azur (vagues bleues en bas) -->
      <path d="M 65 110 Q 75 106 85 110 Q 95 114 105 110 Q 115 106 125 110 Q 132 113 135 110 L 135 130 L 65 130 Z" fill="url(#seaBlue)"/>
      <path d="M 65 116 Q 78 112 90 116 Q 102 120 114 116 Q 126 112 135 116 L 135 130 L 65 130 Z" fill="#0284c7" opacity="0.6"/>

      <!-- Nef Noire (Caravelle battant pavillon gabonais) -->
      <!-- Coque du navire -->
      <path d="M 82 108 Q 88 114 100 114 Q 112 114 118 108 L 122 102 L 78 102 Z" fill="#0f172a" stroke="#d97706" stroke-width="0.5"/>
      <!-- Mât principal -->
      <line x1="100" y1="102" x2="100" y2="86" stroke="#0f172a" stroke-width="1.2"/>
      <!-- Mât avant -->
      <line x1="89" y1="102" x2="89" y2="90" stroke="#0f172a" stroke-width="0.9"/>
      <!-- Voile blanche gonflée -->
      <path d="M 99 87 Q 92 93 99 99 Q 106 93 99 87 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
      <path d="M 88 91 Q 83 95 88 100 Q 93 95 88 91 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.4"/>
      <!-- Pavillon tricolore gabonais à la poupe -->
      <rect x="117" y="96" width="6" height="1.6" fill="#009e49"/>
      <rect x="117" y="97.6" width="6" height="1.6" fill="#fcd116"/>
      <rect x="117" y="99.2" width="6" height="1.6" fill="#0038a8"/>
    </g>

    <!-- Bordure dorée intérieure avec rivets décoratifs -->
    <path d="M 70 64 L 130 64 Q 130 106 100 125 Q 70 106 70 64 Z" fill="none" stroke="#fef08a" stroke-width="0.7" opacity="0.8"/>
  </g>

  <!-- BANDEAU INFÉRIEUR (DEVISE : UNION • TRAVAIL • JUSTICE) -->
  <g id="rubanInferieur" filter="url(#armShadow)">
    <!-- Ruban principal -->
    <path d="M 44 135 Q 100 145 156 135 L 152 143 Q 100 153 48 143 Z" fill="url(#ribbonGrad)" stroke="#cbd5e1" stroke-width="0.6"/>
    <!-- Plis aux extrémités -->
    <path d="M 44 135 L 36 132 L 40 141 L 48 143 Z" fill="#e2e8f0"/>
    <path d="M 156 135 L 164 132 L 160 141 L 152 143 Z" fill="#e2e8f0"/>
    <!-- Liseré tricolore en bordure inférieure du ruban -->
    <path d="M 50 143 Q 100 153 150 143" stroke="#009e49" stroke-width="1" fill="none"/>
    <path d="M 50 144 Q 100 154 150 144" stroke="#fcd116" stroke-width="1" fill="none"/>
    <path d="M 50 145 Q 100 155 150 145" stroke="#0038a8" stroke-width="1" fill="none"/>
    <!-- Texte de la devise nationale -->
    <text x="100" y="141.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="4.2" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">UNION • TRAVAIL • JUSTICE</text>
  </g>
</svg>
